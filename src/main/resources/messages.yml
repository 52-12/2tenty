# 2tenty messages and branding. Every user-facing message can be overridden here - a missing
# key just uses the built-in default, so you only need entries for what you want to change.
#
# Messages use MiniMessage formatting (<red>, <#DBC258>, <b>...</b>) plus:
#   - {placeholders} like {player}, {team}, {name} - filled in by the plugin
#   - branding color tags (<primary>, <error>, ...) that resolve to the colors set in the
#     branding section below, so re-theming the whole plugin is a one-place change
#
# Run /2tentyreload after editing to apply changes without restarting the server.

branding:
  # The plugin's display name, used via {name} in help texts - change this (and the tab
  # section below) to rebrand everything players see
  name: "2tenty"
  # The "2tenty" logo colour, shared by the tab list header and the scoreboard title
  title: "#2881C6"
  primary: "#DBC258"    # gold - titles, headers, announcements
  alert: "#DB5858"      # soft red - dramatic broadcasts (secession etc.)
  success: "green"
  error: "red"
  muted: "gray"
  highlight: "yellow"
  ally: "aqua"

misc:
  no-matching-player: "<error>No matching player found"
  player-only: "<error>You need to be a player for this command"

chat:
  # Typed in chat, these tokens are replaced with the sender's own live stat, e.g. [kills] -> "Kills: 12"
  placeholder-kills: "<#FFE08F>Kills: {value}"
  placeholder-deaths: "<#FFE08F>Deaths: {value}"
  placeholder-fishes: "<#FFE08F>Fishes: {value}"
  placeholder-playtime: "<#FFE08F>Playtime: {value}"

tab:
  header-title: "<b><title>2TENTY</b>"
  header-subtitle: "<#C4C4C4>by 3upman"
  # The TPS / player-count line at the bottom of the tab list ({tps} and {players} are filled in)
  footer-status: "<#BCBCBC>TPS <#79ADD6>{tps}   <#BCBCBC>Players <#79ADD6>{players}"
  footer-url: "<#9F9F9F>2tenty.MineHut.gg"

help:
  category-commands: "View a list of {name}'s custom commands"
  category-enchantments: "View a list of {name}'s custom enchantments"
  category-recipes: "View a list of {name}'s custom recipes"
  category-articles: "View a list of {name}'s community written articles"

