name: 2tenty
# version and api-version are filled in at build time from gradle.properties (see build.gradle's
# processResources block). Change the target Minecraft version there, not here.
version: '${version}'
main: threeadd.glimpsy.Glimpsy
description: The 2tenty void survival gameplay by 3upman
api-version: '${apiVersion}'
authors: [ 3upman ]
bootstrapper: threeadd.glimpsy.GlimpsyBootstrap
dependencies:
  server:
    FastAsyncWorldEdit:
      load: OMIT
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    DiscordSRV:
      load: BEFORE
      required: false
      join-classpath: true
    ViaVersion:
      load: OMIT
      required: false
      join-classpath: true