# 2tenty gameplay-balance config. Structural things (permissions, command names, database
# schema, item/material pools) are NOT here - only tunable numbers: radii, percentages,
# multipliers, chances, limits, cooldowns.
#
# Run /2tentyreload after editing to apply changes without restarting the server.

tnt:
  explosion-radius: 12.0
  # Scales TNT damage dealt to players (after distance falloff) - block destruction is
  # unaffected. 1.0 = vanilla, 0.5 = half damage
  player-damage-multiplier: 0.5
  overall-max-trail-blocks: 1000
  trail-extension: 60
  wave-delay-ticks: 4

bridge-egg:
  # How many Bridge Eggs one player can carry at a time (counted anywhere in their inventory,
  # including inside bundles and carried shulker boxes)
  max-per-player: 1
  max-length: 128
  full-stack-required: 64
  placement-delay-ticks: 3
  recent-placement-window-minutes: 10
  clear-delay-seconds: 45
  clear-batch-size: 3
  clear-step-delay-ticks: 2
  max-clear-blocks: 5000

anvil:
  # true removes vanilla's 40-level "Too Expensive" cap (a chat message shows the real cost
  # once it passes 40, since the GUI hides it)
  remove-too-expensive-cap: true
  # Multiplies every anvil operation's level cost (1.0 = vanilla)
  cost-multiplier: 1.0
  # Flat level cost for every anvil operation, ignoring vanilla's calculation and the
  # multipliers (-1 = disabled)
  flat-cost: -1
  # Hard cap on the final level cost (-1 = no cap)
  max-cost: -1
  # true stops the hidden per-item penalty that doubles with every anvil use and makes
  # repeated anvil work spiral toward unaffordable
  disable-cost-doubling: false
  # Per-item multipliers applied on top of cost-multiplier, keyed by the result item's
  # material name (any item not listed uses 1.0)
  item-multipliers:
    # netherite_sword: 2.0
    # enchanted_book: 0.5
  # Flat level cost when the result is this item, replacing vanilla's calculation and all
  # multipliers for that item. Takes priority over flat-cost; items not listed fall back to
  # flat-cost (if set) or the multiplier calculation.
  item-flat-costs:
    # netherite_chestplate: 10
    # enchanted_book: 3

bamboo:
  # Extra growth ticks aimed only at bamboo, on top of the world's normal randomTickSpeed
  # gamerule (which speeds up every crop/sapling/leaf and can't target just one block type).
  # This many random positions per loaded chunk are sampled each game tick, and only bamboo
  # found at one grows. Note this is a whole-column sample, unlike vanilla's random ticks
  # (3 per 16x16x16 section), so start low and raise it until growth feels right.
  # 0 = disabled, no extra growth.
  extra-random-ticks: 0

stats:
  top-list-size: 10

scoreboard:
  # false turns off the sidebar scoreboard for everyone
  enabled: true
  update-interval-seconds: 1

map-reset:
  # false turns off the scheduled automatic reset entirely (/mapreset still works manually,
  # and /mapreset pause|resume control the countdown)
  enabled: true
  # Hours between automatic resets (72 = 3 days)
  interval-hours: 72
  # true: if the timer ran out while the server was offline, run the reset right away on startup
  # instead of quietly starting a fresh interval - the map still gets reset even though the
  # process was down when it was due. false = the old skip-the-missed-reset behaviour.
  reset-if-overdue-on-start: true
  # The reset runs in waves of these settings so it uses as much RAM as is safe without OOMing
  # the server (issue #23). The region is split into pieces no bigger than session-block-limit,
  # then each wave runs several pieces concurrently; how many depends on free heap.
  # Max concurrent FAWE edit sessions. 0 = use the machine's CPU count.
  max-threads: 0
  # Largest region piece the map is split into - this bounds how many blocks one edit session can
  # queue, which is what keeps any single session's memory use in check.
  session-block-limit: 2000000
  # Free heap (MB) the reset always leaves untouched for the rest of the server.
  memory-reserve-mb: 256
  # Rough heap (MB) each concurrent session is assumed to use - more free heap means more threads.
  memory-per-thread-mb: 128
  # If free heap drops below this, the reset pauses and waits for memory to free up.
  min-free-mb: 128
  # If it stays below min-free-mb for this long, the reset aborts (instead of risking an OOM).
  abort-timeout-seconds: 300
  # Ticks between waves - a short breather so the JVM can collect between batches.
  batch-delay-ticks: 5

anti-filter:
  # false turns off /antidrop and /antipickup (existing filters stop being enforced too)
  enabled: true

trade-chest:
  # false disables the whole feature: no offers, GUIs, or deliveries (placed chests act like
  # normal ender chests). The crafting recipe follows this on the next restart.
  enabled: true
  # How long each item stack takes to arrive after a trade is accepted - deliveries land one
  # stack at a time, this many minutes apart
  delivery-interval-minutes: 5

articles:
  # Player-written /help articles (/article request|list|edit|delete|cancel|requests).
  # false hides the command and keeps approved articles out of the /help article list -
  # nothing is deleted, so turning it back on brings every stored article with it.
  enabled: true

achievements:
  # false stops achievements being awarded entirely. Already-earned ones are kept and still
  # show in /achievements.
  enabled: true
  # false keeps an unlock between the player who earned it and themselves
  broadcast: true

timezone:
  # Defaults for players who haven't changed anything with /timezone. A player who sets an
  # option and later resets it (or sets it back) follows these again.
  # true = clocks follow daylight savings; false = standard time all year.
  default-daylight-savings: true
  # false hides seconds on the scoreboard clock (12:34 instead of 12:34:56).
  default-show-seconds: true
  # auto = American zones get month/day/year + 12-hour, everyone else day/month/year + 24-hour.
  # us / eu force one layout for everyone regardless of zone.
  default-format: auto
  # Extra or replacement abbreviations for /timezone, as "IANA/Zone|Display Name" (the name is
  # optional). Anything listed here is applied on top of the built-in list, so a key that
  # already exists is repointed - which is how ambiguous abbreviations get settled. Out of the
  # box CST is US Central Time; uncomment below if your players mean China instead.
  abbreviations: {}
  #  CST: "Asia/Shanghai|China Time"
  #  SST: "Asia/Singapore|Singapore Time"
  #  IST: "Europe/Dublin|Irish Time"

head-collection:
  # false disables /headcollections and the [heads] chat share. Stored collections are kept.
  enabled: true

head-drop:
  # Chance (0-1) that a killed player drops their own head. Very rare on purpose - heads are
  # trophies, not a resource. 0.002 is roughly 1 in 500 kills; 0 turns head drops off.
  chance: 0.002
  # true only drops a head when another player got the kill - mob kills, fall damage, lava and
  # the like never produce one. false makes any player death eligible.
  require-player-killer: true
  # false keeps the drop silent instead of broadcasting it to the server
  announce: true

trident:
  # false strips tridents from all mob death drops (Drowned are the only vanilla source),
  # making them unobtainable. Tridents players already own are unaffected.
  obtainable: false

seagrass:
  # false strips the seagrass item from shearing/silk-touching seagrass or tall seagrass (the
  # only vanilla source), making it unobtainable. Seagrass players already own is unaffected.
  obtainable: false

mending:
  # false disables the Mending enchantment - items with it no longer repair from XP (the XP
  # goes to the player as normal instead). The enchantment can still appear on items, it just
  # does nothing.
  enabled: true
  # true blocks Mending being applied to diamond tools via the anvil (the only way onto a tool,
  # since Mending is a treasure enchant). Existing Mending on a diamond tool is left alone.
  block-on-diamond-tools: true

teams:
  name-max-length: 12
  invite-expiry-minutes: 5
  ally-damage-multiplier: 0.25
  ally-knockback-multiplier: 0.5
  friendly-kill-limit: 3

nicknames:
  max-length: 24

chat:
  proximity:
    # false turns off the whole proximity-fade feature (nobody sees it, even players who opted in
    # with /proximitychat). When true, only players who opted in see distant chat fade; @mentions
    # always stay highlighted for them.
    enabled: false
  proximity-fade-max-distance: 300.0

guardian-fishing:
  fish-guardian-chance: 0.05
  elder-guardian-chance: 0.15
  trim-template-drop-chance: 0.3
  trimmed-armor-piece-drop-chance: 0.02
  # Chance (0-1) a fished guardian drops a Telekinesis enchanted book - a fishing-only reward,
  # for regular and elder guardians alike.
  telekinesis-book-chance: 0.02
  elder-luck-duration-seconds: 300
  regular-luck-duration-seconds: 120
  # Free-form drop tables for fished guardians, on top of their vanilla drops and the elder-only
  # trim drops below. `loot` rolls for every fished guardian, `elder-loot` additionally for
  # elders. Both take the same two formats as the pools below (plain list, or material: weight),
  # and both are empty by default so nothing changes until you fill one in.
  #     loot:
  #       prismarine_crystals: 3
  #       heart_of_the_sea: 1
  #     loot-chance: 0.25
  #     loot-min-amount: 1
  #     loot-max-amount: 3
  loot: []
  # Chance (0-1) the pool above is rolled at all, per kill
  loot-chance: 1.0
  loot-min-amount: 1
  loot-max-amount: 1
  elder-loot: []
  elder-loot-chance: 1.0
  elder-loot-min-amount: 1
  elder-loot-max-amount: 1
  damaged-armor-max-durability-fraction: 0.5
  # Elder Guardian drop pools (customisable). trim-templates: the smithing templates it can drop.
  # armor-pieces: the base armour a rare pre-trimmed piece is made from.
  trim-templates:
    - bolt_armor_trim_smithing_template
    - coast_armor_trim_smithing_template
    - dune_armor_trim_smithing_template
    - eye_armor_trim_smithing_template
    - flow_armor_trim_smithing_template
    - host_armor_trim_smithing_template
    - raiser_armor_trim_smithing_template
    - rib_armor_trim_smithing_template
    - sentry_armor_trim_smithing_template
    - shaper_armor_trim_smithing_template
    - silence_armor_trim_smithing_template
    - snout_armor_trim_smithing_template
    - spire_armor_trim_smithing_template
    - tide_armor_trim_smithing_template
    - vex_armor_trim_smithing_template
    - ward_armor_trim_smithing_template
    - wayfinder_armor_trim_smithing_template
    - wild_armor_trim_smithing_template
  armor-pieces:
    - leather_helmet
    - leather_chestplate
    - leather_leggings
    - leather_boots
    - iron_helmet
    - iron_chestplate
    - iron_leggings
    - iron_boots

charged-creeper-fishing:
  catch-chance: 0.015
  explosive-book-drop-chance: 0.225

player-fishing:
  catch-chance: 0.001

villager:
  # Professions a villager can never take (so they never offer those trades). Use vanilla
  # profession names. Empty falls back to the default (armorer, librarian, weaponsmith).
  blocked-professions:
    - armorer
    - librarian
    - weaponsmith
  # true strips enchantments off diamond tools sold by toolsmiths
  strip-diamond-tool-enchants: true
  # true stops villagers from breeding
  disable-breeding: true

creeper-spawn:
  cancel-chance: 0.5

suspicious-sand:
  drop-chance-on-break: 0.5
  # Rolled first - a rare chance to get Flint or Quartz instead of the usual common/rare loot
  rare-loot-chance-percent: 3.0
  common-loot-chance-percent: 50
  # Loot pools - two formats. Either a plain list (a material listed twice is twice as likely):
  #     common-loot:
  #       - bow
  #       - diamond
  # or a map of material: weight for exact per-item chances (weight 5 is 5x as likely as 1):
  #     common-loot:
  #       bow: 1
  #       diamond: 5
  # Leave a pool empty to fall back to the built-in default.
  rare-loot:
    - flint
    - quartz
  common-loot:
    - bow
    - nautilus_shell
    - nautilus_shell
    - fishing_rod
    - bundle
    - carrot
    - potato
    - beetroot_seeds
    - wheat_seeds
    - dead_bush
    - dead_bush
    - gold_ingot
    - coal
    - coast_armor_trim_smithing_template
    - dune_armor_trim_smithing_template
    - eye_armor_trim_smithing_template
    - wild_armor_trim_smithing_template
    - raiser_armor_trim_smithing_template
    - rib_armor_trim_smithing_template
    - host_armor_trim_smithing_template
    - sentry_armor_trim_smithing_template
    - shaper_armor_trim_smithing_template
    - snout_armor_trim_smithing_template
    - tide_armor_trim_smithing_template
    - vex_armor_trim_smithing_template
    - ward_armor_trim_smithing_template
    - wayfinder_armor_trim_smithing_template

suspicious-gravel:
  common-loot-chance-percent: 98

void-instakill:
  damage-amount: 10000.0

random-items:
  tick-interval-seconds: 5
  weights:
    iron_nugget: 1
    dirt: 2
    cobblestone: 5
    oak_planks: 4

explosive-enchant:
  # Seconds a player must wait between their Explosive-enchanted arrows actually detonating -
  # an arrow shot before the cooldown is up still lands normally, it just doesn't explode.
  # 0 = no cooldown.
  cooldown-seconds: 0
  # Blocks destroyed per Explosive enchantment level (1-5), independently configurable per level
  # instead of a straight multiplier - a level not listed here falls back to
  # level * blocks-per-level-fallback.
  blocks-per-level:
    1: 3
    2: 6
    3: 9
    4: 12
    5: 15
  blocks-per-level-fallback: 3
  # anvil-cost, max-level, weight, and enchant-cost aren't here - they're read during Paper's
  # plugin bootstrap phase (see ExplosiveEnchantment#createInfo), before config.yml is loaded,
  # so they stay hardcoded in code instead.

guardian:
  luck-duration-seconds: 240
  heart-of-the-sea-base-chance-percent: 30
  heart-of-the-sea-per-looting-level-percent: 11.667

piglin-convert:
  cure-duration-min-ticks: 20
  cure-duration-max-ticks: 100

piglin-skull:
  damage-multiplier: 2.5

skeleton-skull:
  reflect-cooldown-seconds: 3
  reduced-arrow-damage: 1

mud-clay:
  interaction-reach-blocks: 4
  cooldown-ticks: 5
  suspicious-sand-chance: 0.4

lightning-rod:
  cooldown-ticks: 100

ender-pearl-debuff:
  cooldown-ticks: 200

luck-bottle:
  chances:
    cod: 0.2
    pufferfish: 0.5
    tropical_fish: 0.8

saddle-ride:
  cooldown-ticks: 20
  mount-delay-ticks: 20

nautilus-shell:
  cooldown-ticks: 20

hat:
  cooldown-ticks: 20

shield-skin:
  reapply-interval-seconds: 1
