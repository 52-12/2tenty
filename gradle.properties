org.gradle.configuration-cache=true

# --- Minecraft / Paper target version -----------------------------------------------------
# To build for a newer Minecraft version, change these two values and rebuild. Nothing else in
# build.gradle needs editing. See the README section "Updating to a newer Minecraft version".
#
#   minecraftVersion : the exact Paper version to compile against (must be a real published
#                      Paper dev-bundle version, e.g. 1.21.11 or 1.22.1).
#   paperApiVersion  : the Minecraft API level, i.e. just major.minor (e.g. 1.21 or 1.22). This
#                      only changes when the minor version changes (1.21.x -> 1.22).
minecraftVersion=1.21.11
paperApiVersion=1.21
